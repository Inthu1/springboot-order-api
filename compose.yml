services:
  oracle-db:
    image: gvenzl/oracle-free:23-slim
    container_name: order-oracle

    ports:
      - "1521:1521"

    environment:
      ORACLE_PASSWORD: oracle
      APP_USER: ORDER_USER
      APP_USER_PASSWORD: oracle

    volumes:
      - oracle-data:/opt/oracle/oradata

    restart: unless-stopped

volumes:
  oracle-data: